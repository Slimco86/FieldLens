[project]
name = "fieldlens"
dynamic = ["version"]
description = "FieldLens local API, contracts and persistence foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "python-multipart>=0.0.32",
  "numpy>=2.5.4",
  "openai>=3.41.0",
  "pypdf>=6.21.4",
  "fastembed>=0.9.1",
  "pypdfium2==5.14.0",
  "pillow==13.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/fieldlens"]

[tool.hatch.version]
path = "VERSION"
pattern = '(?P<version>[0-9]+\.[0-9]+\.[0-9]+)'

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers -m 'not live_meta and not local_embedder'"
markers = [
  "live_meta: opt-in live provider test; excluded from ordinary runs",
  "local_embedder: opt-in; loads the real local embedding model if installed (never downloads)",
  "local_data: opt-in run against the local Volve subset (needs FIELDLENS_LOCAL_DATA_ROOT)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501", "S105"]

[tool.ruff.lint.isort]
known-first-party = ["fieldlens", "tests"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S104", "S106", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "backend"
packages = ["fieldlens"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
