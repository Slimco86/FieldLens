<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FieldLens visual reference gallery</title>
  <style>
    body { margin: 0 auto; max-width: 1600px; padding: 28px; background: #0a131d; color: #e7f0f4; font: 17px/1.6 system-ui, sans-serif; }
    h1 { margin-bottom: 8px; }
    h2 { margin-top: 42px; }
    p { max-width: 1000px; color: #adc0cc; }
    a { color: #8ce0d4; }
    a:focus-visible { outline: 3px solid #ecb15f; outline-offset: 4px; }
    figure { margin: 20px 0; }
    img { display: block; width: 100%; height: auto; background: #0b1724; border: 1px solid #344b5b; border-radius: 12px; }
    .original { max-width: 680px; padding: 20px; box-sizing: border-box; }
    figcaption { margin-top: 12px; color: #adc0cc; }
  </style>
</head>
<body>
  <header>
    <h1>FieldLens / visual reference gallery</h1>
    <p>Concepts only. Not measured Volve geometry, technical drawings, data fixtures, or a working application.</p>
    <p><a href="README.md">Provenance, external references and design reminders</a></p>
  </header>
  <main>
    <section aria-labelledby="original">
      <h2 id="original">01 / Original conversation wireframe</h2>
      <figure>
        <img class="original" src="assets/conversation-field-wireframe.svg" width="340" height="225" alt="Four conceptual wellbore paths intersecting two formation planes.">
        <figcaption>Recovered unchanged from the supplied conversation; displayed here on a dark background.</figcaption>
      </figure>
    </section>
    <section aria-labelledby="workspace">
      <h2 id="workspace">02 / Full evidence workspace</h2>
      <figure>
        <img src="assets/fieldlens-workspace.svg" width="1600" height="1000" alt="Original FieldLens concept connecting an asset tree, large 3D scene, both chart families, evidence inspector and grounded assistant." loading="lazy">
        <figcaption>Original repository-authored sheet. Layout and all example geometry/chart traces are illustrative.</figcaption>
      </figure>
    </section>
    <section aria-labelledby="equipment">
      <h2 id="equipment">03 / Equipment evidence states</h2>
      <figure>
        <img src="assets/equipment-evidence-states.svg" width="1600" height="900" alt="Documented, catalog-derived and generic equipment states. Unknown placement stays unlocated." loading="lazy">
        <figcaption>Source evidence, catalog matches and missing-data placeholders must remain distinguishable.</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
