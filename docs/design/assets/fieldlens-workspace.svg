<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">FieldLens evidence workspace - original UX concept</title>
  <desc id="desc">A conceptual desktop workspace with an asset tree, a large wellbore and geological-context scene, linked production and depth-log charts, an evidence inspector and a grounded assistant. All shapes and chart traces are illustrative, not Volve measurements.</desc>
  <defs>
    <linearGradient id="scene" x2="0" y2="1">
      <stop stop-color="#122a38"/>
      <stop offset="1" stop-color="#0b1724"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#28414f"/>
    </pattern>
  </defs>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #e7f0f4; }
    .muted { fill: #a6bbc8; }
    .tiny { font-size: 13px; }
    .small { font-size: 15px; }
    .body { font-size: 17px; }
    .heading { font-size: 20px; font-weight: 700; }
    .panel { fill: #142331; stroke: #304554; }
    .pill { fill: #213544; stroke: #3b5362; }
    .rule { stroke: #304554; }
  </style>
  <rect width="1600" height="1000" rx="20" fill="#0a131d"/>
  <text x="32" y="52" font-size="29" font-weight="700">FieldLens</text>
  <text x="188" y="51" class="body muted">/ Evidence workspace</text>
  <rect x="1050" y="26" width="214" height="38" rx="19" class="pill"/>
  <text x="1068" y="51" class="small">Historical reconstruction</text>
  <rect x="1280" y="26" width="288" height="38" rx="19" fill="#493322"/>
  <text x="1297" y="51" class="small" fill="#ffe2ad">UX CONCEPT / NOT FIELD DATA</text>
  <text x="32" y="85" class="small muted">Uploaded evidence is the source of truth. The scene, charts and assistant share asset IDs and revisions.</text>
  <rect x="24" y="107" width="1552" height="42" rx="8" class="panel"/>
  <text x="42" y="134" class="small">1  Upload records</text>
  <text x="220" y="134" class="small muted">--&gt;  2  Validate + link evidence</text>
  <text x="488" y="134" class="small muted">--&gt;  3  Reconstruct geometry</text>
  <text x="755" y="134" class="small muted">--&gt;  4  Inspect + investigate</text>
  <text x="1340" y="134" class="small" fill="#70ddd0">Dataset revision visible</text>

  <rect x="24" y="165" width="236" height="693" rx="12" class="panel"/>
  <text x="43" y="198" class="heading">Field explorer</text>
  <text x="43" y="226" class="small muted">Example asset hierarchy</text>
  <line x1="42" x2="240" y1="245" y2="245" class="rule"/>
  <text x="43" y="278" class="body">- Wells / wellbores</text>
  <rect x="36" y="298" width="212" height="38" rx="7" fill="#1d535d"/>
  <circle cx="54" cy="317" r="5" fill="#5ee0d1"/>
  <text x="69" y="323" class="body">Well A / A1</text>
  <circle cx="54" cy="357" r="5" fill="#ecb15f"/>
  <text x="69" y="363" class="body">Well A / A2</text>
  <circle cx="54" cy="397" r="5" fill="#a69cff"/>
  <text x="69" y="403" class="body">Well B / B1</text>
  <circle cx="54" cy="437" r="5" fill="#e68fae"/>
  <text x="69" y="443" class="body">Well C / C1</text>
  <text x="43" y="491" class="body">- Context layers</text>
  <text x="52" y="526" class="small muted">[x] Seabed / terrain</text>
  <text x="52" y="558" class="small muted">[x] Formations</text>
  <text x="52" y="590" class="small muted">[x] Reservoir context</text>
  <text x="43" y="638" class="body">- Linked records</text>
  <text x="52" y="671" class="small muted">Production series</text>
  <text x="52" y="703" class="small muted">Well-log curves</text>
  <text x="52" y="735" class="small muted">Equipment + sources</text>
  <rect x="40" y="770" width="204" height="66" rx="7" fill="#243745"/>
  <text x="52" y="795" class="small">Unlocated equipment</text>
  <text x="52" y="819" class="tiny muted">Visible without invented depth</text>

  <rect x="280" y="165" width="886" height="479" rx="12" fill="url(#scene)" stroke="#304554"/>
  <rect x="281" y="166" width="884" height="477" rx="12" fill="url(#dots)" opacity=".38"/>
  <text x="301" y="199" class="heading">3D field explorer</text>
  <text x="301" y="225" class="tiny muted">Illustrative topology / trajectories / layer extents - not to scale</text>
  <rect x="913" y="180" width="108" height="30" rx="6" class="pill"/>
  <text x="927" y="201" class="tiny">Fit selection</text>
  <rect x="1030" y="180" width="117" height="30" rx="6" class="pill"/>
  <text x="1043" y="201" class="tiny">Reset camera</text>
  <path d="M355 297 L874 245 L1090 320 L567 380 Z" fill="#366b70" fill-opacity=".24" stroke="#648d90"/>
  <path d="M409 290 L617 373 M487 282 L695 365 M565 274 L773 357 M643 266 L851 349 M721 259 L929 341 M799 251 L1007 332 M414 318 L932 265 M468 340 L988 285 M521 361 L1046 305" fill="none" stroke="#537c82" opacity=".5"/>
  <text x="885" y="261" class="small muted">Seabed / terrain context</text>
  <path d="M357 409 L879 361 L1104 433 L583 487 Z" fill="#d3a164" fill-opacity=".12" stroke="#b89364" stroke-opacity=".7"/>
  <path d="M373 474 L895 426 L1120 498 L599 552 Z" fill="#4e9ca5" fill-opacity=".12" stroke="#74b7ba" stroke-opacity=".7"/>
  <path d="M622 503 Q792 452 1016 490 L1101 527 Q860 559 690 561 Z" fill="#bc9a58" fill-opacity=".17" stroke="#d5ad69" stroke-dasharray="7 5"/>
  <text x="963" y="398" class="small" fill="#dcb677">Formation context</text>
  <text x="787" y="582" class="small muted">Reservoir extent: illustrative only</text>
  <path d="M570 292 C572 373 578 417 635 460 S801 513 991 531" fill="none" stroke="#5ee0d1" stroke-width="6" stroke-linecap="round"/>
  <path d="M591 291 C591 355 615 397 686 428 S889 462 1071 476" fill="none" stroke="#ecb15f" stroke-width="4" stroke-linecap="round"/>
  <path d="M628 283 C639 351 665 372 736 390 S920 416 1056 428" fill="none" stroke="#a69cff" stroke-width="4" stroke-linecap="round"/>
  <path d="M540 299 C529 374 536 430 565 477 S681 542 744 566" fill="none" stroke="#e68fae" stroke-width="4" stroke-linecap="round"/>
  <path d="M570 315 L572 370" stroke="#dcf2f4" stroke-width="12" opacity=".65"/>
  <path d="M570 315 L572 370" stroke="#5ee0d1" stroke-width="5"/>
  <circle cx="860" cy="516" r="10" fill="#142331" stroke="#5ee0d1" stroke-width="3"/>
  <path d="M860 506 L860 457 L808 442" fill="none" stroke="#5ee0d1"/>
  <rect x="622" y="393" width="199" height="59" rx="7" fill="#122832" stroke="#4eaaa4"/>
  <text x="636" y="417" class="small">A1 / selected interval</text>
  <text x="636" y="438" class="tiny muted">Inspect claim + source</text>
  <text x="301" y="618" class="tiny muted">Physical scale + depth reference must remain explicit. Any display exaggeration must be labeled.</text>

  <rect x="280" y="662" width="886" height="196" rx="12" class="panel"/>
  <text x="301" y="692" class="heading">Linked charts</text>
  <text x="466" y="690" class="small muted">Selection: Well A / A1 | traceable source association</text>
  <line x1="722" x2="722" y1="710" y2="840" class="rule"/>
  <text x="302" y="721" class="small">Production / time</text>
  <text x="744" y="721" class="small">Well logs / depth</text>
  <path d="M323 742 L323 819 L674 819" fill="none" stroke="#758d9b"/>
  <path d="M325 787 L369 768 L415 780 L454 750 L490 767 M515 772 L553 788 L599 784 L638 800 L672 793" fill="none" stroke="#5ee0d1" stroke-width="3"/>
  <text x="404" y="841" class="tiny muted">Rates/volumes + units; preserve gaps</text>
  <path d="M766 743 L766 819 L1114 819" fill="none" stroke="#758d9b"/>
  <path d="M827 744 L846 753 L820 763 L840 773 L833 783 L854 795 L845 808 L865 818" fill="none" stroke="#ecb15f" stroke-width="3"/>
  <path d="M963 744 L984 755 L961 765 L994 777 L970 789 L1004 802 L991 818" fill="none" stroke="#a69cff" stroke-width="3"/>
  <text x="813" y="841" class="tiny muted">Curve units + MD/TVD reference</text>

  <rect x="1184" y="165" width="392" height="352" rx="12" class="panel"/>
  <text x="1205" y="199" class="heading">Evidence inspector</text>
  <text x="1205" y="231" class="small muted">Selected: equipment / interval</text>
  <rect x="1203" y="249" width="171" height="29" rx="14" fill="#1d5350"/>
  <text x="1217" y="269" class="tiny">Source-backed property</text>
  <text x="1205" y="306" class="small">Dimensions + original units</text>
  <text x="1205" y="334" class="small">Depth reference + placement</text>
  <text x="1205" y="362" class="small">Configuration date / revision</text>
  <line x1="1204" x2="1556" y1="382" y2="382" class="rule"/>
  <rect x="1204" y="397" width="351" height="52" rx="7" fill="#203846" stroke="#406071"/>
  <text x="1220" y="418" class="small">Open supporting record</text>
  <text x="1220" y="438" class="tiny muted">Document ID + page/table/cell locator</text>
  <text x="1205" y="480" class="tiny muted">Evidence class and validation are separate.</text>
  <text x="1205" y="500" class="tiny muted">Missing values stay visible, never zero-filled.</text>

  <rect x="1184" y="533" width="392" height="325" rx="12" class="panel"/>
  <text x="1205" y="568" class="heading">Field assistant</text>
  <rect x="1204" y="586" width="351" height="52" rx="9" fill="#263a4b"/>
  <text x="1220" y="607" class="small">Compare these wellbore intervals</text>
  <text x="1220" y="627" class="tiny muted">and show the supporting evidence.</text>
  <text x="1205" y="669" class="small">Retrieves records + calls typed tools</text>
  <text x="1205" y="697" class="small muted">Highlights the same selected objects</text>
  <text x="1205" y="725" class="small muted">Returns citations or explicit unknowns</text>
  <rect x="1204" y="743" width="351" height="36" rx="7" fill="#1b3438"/>
  <text x="1217" y="766" class="tiny" fill="#8bdcd0">Live / cached / failed status must be explicit</text>
  <rect x="1204" y="795" width="270" height="42" rx="7" fill="#0c1924" stroke="#406071"/>
  <text x="1217" y="821" class="small muted">Ask about uploaded evidence...</text>
  <rect x="1486" y="795" width="69" height="42" rx="7" fill="#28666d"/>
  <text x="1501" y="821" class="small">Send</text>

  <rect x="24" y="880" width="1552" height="96" rx="12" fill="#152732"/>
  <text x="43" y="910" class="body" font-weight="700">Design reminders</text>
  <text x="43" y="938" class="small muted">Scene first, not scene only. Keep both chart families and context layers. Selection must connect geometry, records and answers.</text>
  <text x="43" y="962" class="small muted">No live telemetry, invented reservoir connectivity or unlabeled generic equipment. This sheet proposes a layout, not a final UI specification.</text>
</svg>
