# FieldLens local PostgreSQL 17 + pgvector 0.8 service (loopback only).
# Lane FL-004-A: container port 5432 -> 127.0.0.1:55432. Override with env vars.
#
#   docker compose --env-file .local/fieldlens/fl-004-a-foundation/db.env \
#     -f infra/compose.yaml up -d --wait
#
# The password is supplied through FIELDLENS_DB_PASSWORD (required, never committed).
name: fieldlens-fl004a
services:
  postgres:
    # pgvector 0.8.1 on PostgreSQL 17; digest pinned 2026-10-28.
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    container_name: fieldlens-fl004a-postgres
    restart: "no"
    environment:
      POSTGRES_USER: ${FIELDLENS_DB_USER:-fieldlens_fl004a}
      POSTGRES_PASSWORD: ${FIELDLENS_DB_PASSWORD:?set FIELDLENS_DB_PASSWORD in an untracked env file}
      POSTGRES_DB: ${FIELDLENS_DB_NAME:-fieldlens_fl004a_w1}
    ports:
      - "127.0.0.1:${FIELDLENS_DB_PORT:-55432}:5432"
    volumes:
      - fieldlens_fl004a_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  fieldlens_fl004a_pgdata:
